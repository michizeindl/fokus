<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F7C80">
<title>Fokus – Guntram Muster Optik &amp; Akustik</title>
<link rel="manifest" href="fokus.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fokus">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="schrift/poppins.css">
<link rel="stylesheet" href="start/start.css">
<script src="kunde/kunde.js"></script>
<script src="optik-fokus/daten.js"></script>
<script src="optik-fokus/klaenge.js"></script>
<script>
// Intro nur beim ersten Öffnen je Sitzung (oder mit #intro in der Adresse); Klasse vor dem ersten Bild setzen
(function () {
  var k = 'mg:intro:fokus:' + ((window.KUNDE || {}).firma || ''), gesehen = null;
  try { gesehen = sessionStorage.getItem(k); } catch (e) { gesehen = '1'; }
  if (!gesehen || /^#intro\b/.test(location.hash)) document.documentElement.classList.add('intro');
})();
</script>
</head>
<body>
<header class="kopf">
  <button class="ton" id="tonKnopf" type="button" aria-label="Ton an oder aus"></button>
  <div class="logo" id="logo" role="img" aria-label="Guntram Muster Optik &amp; Akustik GmbH"></div>
</header>

<main class="inhalt">
  <div class="links">
    <div class="linse" id="linse">
      <svg class="fassung" viewBox="0 0 512 512" aria-hidden="true"></svg>
      <div class="glas"><span class="geist" aria-hidden="true">Fokus</span><h1 class="name" id="name">Fokus</h1></div>
    </div>
    <p class="gesamt" id="gesamt"></p>
  </div>
  <nav class="stufen" id="stufen" aria-label="Level"></nav>
</main>

<footer class="fuss" id="fuss"></footer>

<script src="start/fokus-basis.js"></script>
<script src="start/fokus-icon.js"></script>
<script src="start/start.js"></script>
<script src="start/intro.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
